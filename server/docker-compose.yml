services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: osrs
      POSTGRES_PASSWORD: osrs
      POSTGRES_DB: osrs_xp_tracker
    ports:
      - '5432:5432'
    volumes:
      - osrs_xp_tracker_pgdata:/var/lib/postgresql/data

volumes:
  osrs_xp_tracker_pgdata:
